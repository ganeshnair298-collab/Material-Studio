<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Material 3 layout</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font: 14px Arial, sans-serif;
            color: #292532;
            background: #f5f3fa;
        }

        main {
            position: relative;
            min-height: 616px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 16px;
        }

        button,
        input {
            font: inherit;
        }

        .text {
            display: flex;
            align-items: center;
            font-weight: 600;
        }

        .filled,
        .outlined,
        .chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .filled {
            border: 0;
            color: white;
            background: var(--accent);
        }

        .outlined,
        .chip {
            color: var(--accent);
            border: 1px solid var(--accent);
            background: transparent;
        }

        .field,
        .choice,
        .slider {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .field {
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            border: 1px solid #79747e;
            padding: 8px 12px;
        }

        .field input {
            width: 100%;
            border: 0;
            outline: 0;
            background: transparent;
        }

        .card,
        .image {
            display: flex;
            align-items: center;
            padding: 16px;
            background: var(--accent);
        }

        .image {
            justify-content: center;
            color: #49454f;
            border: 1px dashed #79747e;
        }

        .choice input,
        .slider input {
            accent-color: var(--accent);
        }

        .slider {
            flex-direction: column;
            align-items: stretch;
            justify-content: center;
        }

        .circular-progress,
        .wavy-progress {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .circular-progress {
            background: transparent;
        }

        .circular-progress svg {
            width: 48px;
            height: 48px;
            transform: rotate(-90deg);
        }

        .wavy-progress svg {
            width: 100%;
            height: 24px;
            overflow: visible;
        }

        .progress-track,
        .progress-indicator {
            fill: none;
            stroke-width: 3;
            stroke-linecap: round;
        }

        .progress-track {
            stroke: color-mix(in srgb, var(--accent) 18%, transparent);
        }

        .progress-indicator {
            stroke: var(--accent);
        }

        .circular-progress .progress-track,
        .circular-progress .progress-indicator {
            stroke-width: 4;
        }

        .circular-progress .progress-track {
            stroke-dasharray: 126;
        }

        .circular-progress .progress-indicator {
            stroke-dasharray: 82 44;
        }

        hr {
            margin: 0;
            border: 0;
            border-top: 1px solid;
        }
    </style>
</head>

<body>
    <main>
        <div class="image" role="img" aria-label="Add an image"
            style="width:280px;height:auto;min-height:160px;font-size:14px;border-radius:16px;--accent:#e9e5ee">Add an
            image</div>
        <button class="filled"
            style="width:132px;height:auto;min-height:40px;font-size:14px;border-radius:20px;--accent:#6750a4">Continue</button>
        <section class="m3-component m3-elevatedButton"
            style="width:132px;height:auto;min-height:40px;font-size:14px;border-radius:20px;--accent:#6750a4">Elevated
        </section>
        <section class="m3-component m3-xrNavigationBar"
            style="width:320px;height:auto;min-height:80px;font-size:14px;border-radius:28px;--accent:#6750a4">Home
        </section>
    </main>
</body>

</html>
